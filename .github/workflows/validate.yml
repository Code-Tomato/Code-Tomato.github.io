# Read-only validation for every push and pull request. It builds and tests;
# it never deploys. Publishing stays in deploy.yml (main only).
name: Validate

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

# Nothing here writes to the repository, Pages, or anything else.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type and template check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check the built site
        run: npm run test:static
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
